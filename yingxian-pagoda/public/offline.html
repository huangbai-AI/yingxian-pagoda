<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一木承一木 · 离线光影样片</title><link rel="icon" href="/seal.svg"><style>
@font-face{font-family:Pagoda;src:url('/fonts/pagoda-serif.woff2')}*{box-sizing:border-box}body{margin:0;background:#071a1d;color:#f4e6cf;font-family:Pagoda,serif}a{color:inherit;text-decoration:none}header{position:fixed;inset:0 0 auto;z-index:4;padding:28px 4vw;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#071a1dcc,transparent)}header strong{font-weight:400;letter-spacing:3px;font-size:24px}header a{font-size:14px;border-bottom:1px solid #d4bd8a66;padding:8px 0}.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 55% 44%,#324640,#071a1d 75%)}video{width:100%;height:100%;object-fit:cover;display:block}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#0316199c,transparent 48%);pointer-events:none}.copy{position:absolute;top:22%;left:4%;max-width:43%}.eyebrow{font-size:14px;letter-spacing:4px;color:#cbbd9f}h1{font-size:clamp(40px,5.3vw,86px);font-weight:400;margin:22px 0;line-height:1.22}p{font-size:18px;letter-spacing:2px;line-height:1.9;margin:0}.small{font-size:12px;color:#b6b8a5;margin-top:28px;letter-spacing:1px}.footer{position:absolute;bottom:6%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:end;gap:30px}.scrub{width:min(330px,40vw)}label{display:block;font-size:12px;letter-spacing:2px;margin-bottom:12px}input{width:100%;accent-color:#dbc393;cursor:pointer}#journey{height:400vh;height:400svh}#status{position:absolute;bottom:18%;right:4%;font-size:13px;color:#d7c6a7}#progress{position:fixed;z-index:5;top:0;left:0;height:2px;background:#d4b370;transform-origin:left;width:100%;transform:scaleX(0)}button{font:inherit;background:#19312b;color:#f4e6cf;border:1px solid #a18e66;padding:8px 15px;cursor:pointer}button[hidden]{display:none}a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #e4c483;outline-offset:6px}@media(max-width:700px){header{padding:22px 6%}header strong{font-size:19px}header a{font-size:12px}video{object-fit:contain}.copy{left:6%;top:14%;max-width:90%}h1{font-size:42px;margin:12px 0}.copy p{font-size:15px}.small{margin-top:12px}.footer{left:6%;right:6%;bottom:6%;display:block}.footer p{font-size:12px}.scrub{margin-top:24px;width:100%}.veil{background:linear-gradient(#071a1d55,transparent 36%,transparent 67%,#071a1d77)}}
</style></head><body><div id="progress"></div><header><strong>应县木塔</strong><a href="/?v=12">返回实时观塔 ↗</a></header><div class="stage"><video id="film" muted playsinline preload="auto" poster="/offline/poster.jpg" aria-label="斗栱高精度渲染，进度由滚动控制"></video><div class="veil"></div><div class="copy"><div class="eyebrow">离线光影 / 斗栱细部</div><h1>一木承一木。</h1><p>顺着微光，看见木的肌理。</p><p class="small">真实模型逐帧渲染 · 近景运镜样片<br><a href="/offline/detail-1080.jpg" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;border-bottom:1px solid #bba77c77">查看高清静帧 ↗</a></p></div><div id="status" role="status">正在准备样片…</div><div class="footer"><p>向下滚动，缓缓近看。<br>向上滚动，沿原路返回。</p><div class="scrub"><label for="seek">镜头进度 <span id="percent">0%</span></label><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="镜头进度"><button id="retry" hidden>重新加载样片</button></div></div></div><main id="journey" aria-label="滚动浏览斗栱样片"></main><script>
const film=document.querySelector('#film'),slider=document.querySelector('#seek'),status=document.querySelector('#status'),retry=document.querySelector('#retry');let ready=false,target=0,queued=false,failed=false;
const clamp=x=>Math.max(0,Math.min(1,x));
function progress(){return clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))}
function seek(){queued=false;if(!ready||failed||film.seeking)return;const time=target*Math.max(0,film.duration-1/24);if(Math.abs(film.currentTime-time)>1/48)film.currentTime=time;}
function update(){target=progress();slider.value=Math.round(target*1000);document.querySelector('#percent').textContent=Math.round(target*100)+'%';document.querySelector('#progress').style.transform=`scaleX(${target})`;if(!queued){queued=true;requestAnimationFrame(seek)}}
film.addEventListener('loadeddata',()=>{ready=true;failed=false;status.textContent='';retry.hidden=true;update()});film.addEventListener('seeked',()=>{if(!queued){queued=true;requestAnimationFrame(seek)}});film.addEventListener('error',()=>{failed=true;status.textContent='样片加载失败，可重新加载或返回实时观塔。';retry.hidden=false});let objectURL;async function loadFilm(){ready=false;failed=false;status.textContent='正在准备样片…';retry.hidden=true;try{const response=await fetch('/offline/dougong.mp4?v=2');if(!response.ok)throw Error('加载失败');const blob=await response.blob();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);film.src=objectURL;film.load()}catch(e){failed=true;status.textContent='样片加载失败，请重试。';retry.hidden=false}}retry.onclick=loadFilm;window.addEventListener('pagehide',()=>{if(objectURL)URL.revokeObjectURL(objectURL)});window.addEventListener('pageshow',event=>{if(event.persisted)loadFilm()});loadFilm();slider.addEventListener('input',()=>{window.scrollTo({top:slider.value/1000*(document.documentElement.scrollHeight-innerHeight),behavior:'instant'});update()});window.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);update();window.__offline={stats:()=>({ready,failed,target,currentTime:film.currentTime,duration:film.duration,seeking:film.seeking})};
</script></body></html>
