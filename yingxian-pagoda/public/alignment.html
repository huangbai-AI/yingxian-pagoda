<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/seal.svg"><title>六幕光影与排版对照</title><style>*{box-sizing:border-box}body{margin:0;background:#08191b;color:#eee1c8;font-family:serif}header{padding:24px 3vw;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;font-weight:400;margin:0}a{color:inherit}p{margin:0 3vw 20px;color:#b5beb0;line-height:1.8;font-size:14px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:0 3vw 22px}button{font:inherit;background:transparent;color:inherit;border:1px solid #61716b;padding:9px 18px;cursor:pointer}button[aria-pressed=true]{background:#e4d1a8;color:#122122}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 3vw}figure{margin:0}figcaption{padding:12px 0;letter-spacing:2px;font-size:14px}img{width:100%;display:block}footer{margin:24px 3vw;color:#b6beb2;font-size:13px}.mode{margin:24px 3vw 0}@media(max-width:760px){header{align-items:start}h1{font-size:20px}.views{grid-template-columns:1fr}nav{gap:6px}button{padding:8px 12px}}</style><header><h1>六幕光影与排版对照</h1><a href="/?v=13">进入网站 ↗</a></header><p>左侧为确认的设计稿，右侧为真实网页截图。逐幕查看文字位置、冷暖关系与明暗层次。</p><nav aria-label="选择篇章"></nav><div class="views"><figure><figcaption>原设计稿</figcaption><img id="design" alt="当前篇章的原设计稿"></figure><figure><figcaption id="caption">本轮实际页面</figcaption><img id="actual" alt="当前篇章的实际网页截图"></figure></div><div class="mode"><button id="toggle" aria-pressed="false">查看修改前</button></div><footer>本轮恢复第四幕斗栱原来的取景方向，保留已有材质和淡背景纹理。可切换对比修改前后的模型位置。 <a href="/offline.html?v=5">离线渲染备选样片 ↗</a></footer><script>let active=1,before=false;const names=['初见','解构','柱网','斗栱','飞檐','守护'];const nav=document.querySelector('nav');function render(){const id=String(active).padStart(2,'0');document.querySelector('#design').src='/alignment/design-'+id+'.png';document.querySelector('#actual').src='/alignment/'+(before?'texture-before':'latest')+'-'+id+'.png?v=13';document.querySelector('#caption').textContent=before?'修改前实际页面':'本轮实际页面';[...nav.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(active===i+1)))}names.forEach((n,i)=>{const b=document.createElement('button');b.textContent='0'+(i+1)+' / '+n;b.onclick=()=>{active=i+1;render()};nav.append(b)});document.querySelector('#toggle').onclick=e=>{before=!before;e.currentTarget.textContent=before?'查看本轮修改':'查看修改前';e.currentTarget.setAttribute('aria-pressed',String(before));render()};render();</script></html>
