<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#071c1b;color:#ebdfc2;font-family:"Songti SC",serif}main{max-width:1500px;margin:auto;padding:48px 4vw}h1{font-weight:500;font-size:clamp(30px,4vw,52px)}p{line-height:1.9;color:#bdc5b5}a{color:#dfc58c}button{background:transparent;color:inherit;border:1px solid #637064;padding:12px 19px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#dbcbab;color:#172c26}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.compare{position:relative;aspect-ratio:1672/940;overflow:hidden;border:1px solid #41564a}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.after{clip-path:inset(0 0 0 var(--split,50%))}.divider{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#ead6a5;pointer-events:none}.badge{position:absolute;top:14px;padding:7px 14px;background:#071c1bcc}.before-tag{left:14px}.after-tag{right:14px}input{width:100%;accent-color:#cfb47e;margin:22px 0}label{display:block;margin-top:18px}section{margin-top:40px}.note{font-size:14px}img.phone{width:260px;max-width:100%;display:block;margin-top:24px}</style><title>平座承托 · 修改对照</title><main><a href="http://127.0.0.1:5188/#eaves">打开实时网站 ↗</a><h1>让每一层，接得住。</h1><p>重点看栏杆下方：坐斗下落在连续承梁上，上方挑梁托住楼板；屋面内缘收在承托带下方。第二至第五层采用同样的修正。</p><nav><button data-detail="seat" aria-pressed="true">平座与屋面</button><button data-detail="bracket" aria-pressed="false">斗栱完整承接</button></nav><div class="compare" id="compare"><img id="before" src="修改前.png" alt="修改前"><img id="after" class="after" src="修改后.png" alt="修改后"><div class="divider"></div><span class="badge before-tag">修改前</span><span class="badge after-tag">修改后</span></div><label for="split">拖动比较同一位置</label><input id="split" type="range" min="0" max="100" value="50" aria-label="修改前后分界位置"><script>document.querySelector('#split').addEventListener('input',e=>document.querySelector('#compare').style.setProperty('--split',e.target.value+'%'));</script><p class="note">此处对照保留相同光影与镜头，集中比较组合变化。<a href="../光影材质升级/修改对照.html">查看背景、材质及光影的整体对照 ↗</a></p><p>斗栱近景同时补回此前凹槽加工误切的构件。改为逐件加工浅槽，核对外轮廓与保留体积，完整保留坐斗和三层栱。</p></main><script>document.querySelectorAll("button[data-detail]").forEach(b=>b.addEventListener("click",()=>{const prefix=b.dataset.detail==="bracket"?"斗栱":"";document.querySelector("#before").src=prefix+"修改前.png";document.querySelector("#after").src=prefix+"修改后.png";document.querySelectorAll("button[data-detail]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));}));</script></html>
