<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#071c1b;color:#ebdfc2;font-family:"Songti SC",serif}main{max-width:1500px;margin:auto;padding:48px 4vw}h1{font-weight:500;font-size:clamp(30px,4vw,52px)}p{line-height:1.9;color:#bdc5b5}a{color:#dfc58c}button{background:transparent;color:inherit;border:1px solid #637064;padding:12px 19px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#dbcbab;color:#172c26}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.compare{position:relative;aspect-ratio:1672/940;overflow:hidden;border:1px solid #41564a}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.after{clip-path:inset(0 0 0 var(--split,50%))}.divider{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#ead6a5;pointer-events:none}.badge{position:absolute;top:14px;padding:7px 14px;background:#071c1bcc}.before-tag{left:14px}.after-tag{right:14px}input{width:100%;accent-color:#cfb47e;margin:22px 0}label{display:block;margin-top:18px}section{margin-top:40px}.note{font-size:14px}img.phone{width:260px;max-width:100%;display:block;margin-top:24px}</style><title>木塔细节 · 六幕对照</title><main><a href="http://127.0.0.1:5188/">打开实时网站 ↗</a><h1>木纹、雾光与承托。</h1><p>加入真实扫描木纹和浅凹槽，增强侧光与檐下反射光；墨绿金色雾光随篇章移动，去除滚动中的随机颗粒。第五幕同时修正平座与屋面的接合。</p><nav><button data-index="1" aria-pressed="false">01 初见</button><button data-index="2" aria-pressed="false">02 斜向拆层</button><button data-index="3" aria-pressed="false">03 柱网</button><button data-index="4" aria-pressed="false">04 斗栱</button><button data-index="5" aria-pressed="true">05 飞檐归位</button><button data-index="6" aria-pressed="false">06 全景守护</button></nav><div class="compare" id="compare"><img id="before" src="修改前/05.png" alt="修改前"><img id="after" class="after" src="桌面_05.png" alt="修改后"><div class="divider"></div><span class="badge before-tag">修改前</span><span class="badge after-tag">修改后</span></div><label for="split">拖动比较同一位置</label><input id="split" type="range" min="0" max="100" value="50" aria-label="修改前后分界位置"><script>document.querySelector('#split').addEventListener('input',e=>document.querySelector('#compare').style.setProperty('--split',e.target.value+'%'));</script><section><h2>手机取景</h2><img id="phone" class="phone" src="手机_05.png" alt="手机实际页面"></section><p class="note"><a href="../结构修正/连接处对照.html">查看结构连接的单独对照 ↗</a> · <a href="../渲染验证/实际效果浏览.html">查看六幕网页与独立渲染 ↗</a></p></main><script>document.querySelectorAll('button[data-index]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.index.padStart(2,'0');document.querySelector('#before').src='修改前/'+n+'.png';document.querySelector('#after').src='桌面_'+n+'.png';document.querySelector('#phone').src='手机_'+n+'.png';document.querySelectorAll('button[data-index]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));</script></html>
